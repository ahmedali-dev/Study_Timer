name: FocusNest Rust desktop checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['focusnest_rust/**', '.github/workflows/focusnest-rust.yml', '.github/workflows/focusnest-release.yml', '.gitattributes']
  push:
    branches: ['main']
    paths: ['focusnest_rust/**', '.github/workflows/focusnest-rust.yml', '.github/workflows/focusnest-release.yml', '.gitattributes']

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle: app
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: focusnest_rust
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: focusnest_rust/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: FocusNest-Rust-${{ runner.os }}
          path: focusnest_rust/src-tauri/target/release/bundle/
          if-no-files-found: error
